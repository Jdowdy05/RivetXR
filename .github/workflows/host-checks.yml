name: Host checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-remote.txt
      - name: Install host dependency
        run: python -m pip install -r requirements-remote.txt
      - name: Build native host contracts
        run: |
          cmake -S . -B out/host -DBUILD_TESTING=ON
          cmake --build out/host --config Debug --parallel 2
      - name: Run native contracts
        run: ctest --test-dir out/host -C Debug --output-on-failure
      - name: Run remote scene tests
        run: python -m unittest discover -s tools/remote_scene/tests -v
      - name: Check package fixtures
        run: python -m unittest tools.full_port.tests.test_apk tools.full_port.tests.test_remote_demo_assets -v
      - name: Check Java and native transport interoperability
        shell: pwsh
        run: |
          $env:JAVA_HOME=$env:JAVA_HOME_17_X64
          $env:Path="$env:JAVA_HOME/bin;$env:Path"
          python -m unittest discover -s tests/remote_scene_transport -v
      - name: Generate every demo representation
        run: python -m tools.remote_scene.demo --output out/demo/remote_scene/demo.rscn --all-modes
